{% extends "layout.html" %}
{% block content %}

<div class="min-h-screen bg-[#F3F4F6] py-12">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">

        <div class="mb-6 flex justify-between items-center">
            <a href="/post/{{ post.id }}" class="inline-flex items-center gap-2 text-gray-500 hover:text-purple-700 transition font-medium">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M15 19l-7-7 7-7"></path>
                </svg>
                글로 돌아가기
            </a>
            <div class="w-20 sm:hidden"></div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 sm:p-10">

            <div class="mb-8 border-b border-gray-100 pb-5">
                <h1 class="text-2xl font-bold text-gray-900">게시글 수정</h1>
                <p class="text-gray-500 text-sm mt-1">작성하신 글의 내용을 수정합니다.</p>
            </div>

            <form action="/post/{{ post.id }}/edit" method="post" class="space-y-8">

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">제목</label>
                    <input type="text" name="title" required maxlength="100"
                           value="{{ post.title }}"
                           class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:bg-white focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition"
                           placeholder="제목을 입력해주세요" />
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">내용</label>
                    <textarea name="content" rows="15" required maxlength="1000"
                              class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:bg-white focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition resize-none leading-relaxed"
                              placeholder="내용을 입력해주세요.">{{ post.content }}</textarea>
                </div>

                {% if post.type == 'balance' %}
                <div class="bg-gray-50 rounded-xl p-6 border border-gray-200 opacity-90 select-none">
                    <div class="flex items-center justify-between mb-4">
                        <label class="block text-sm font-bold text-gray-500">
                            투표 선택지
                            <span class="font-normal text-xs ml-1">(이미지/항목 변경 불가)</span>
                        </label>
                        <span class="text-xs text-red-500 font-bold bg-red-50 px-2 py-1 rounded border border-red-100 flex items-center gap-1">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                            수정 불가
                        </span>
                    </div>

                    <div class="space-y-3">
                        {% for option in options %}
                        <div class="flex gap-2 items-center">
                            <div class="flex-1 relative">
                                <span class="absolute left-4 top-3.5 text-gray-400 text-sm font-bold">#{{ loop.index }}</span>
                                <input type="text" value="{{ option.content }}" disabled
                                       class="w-full pl-12 pr-4 py-3 bg-gray-100 border border-gray-200 rounded-xl text-gray-500 cursor-not-allowed shadow-inner">
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                    <p class="text-xs text-gray-400 mt-3 ml-1">
                        * 투표의 공정성을 위해 게시 후에는 선택지를 수정하거나 삭제할 수 없습니다.
                    </p>
                </div>
                {% endif %}

                <div class="pt-6 border-t border-gray-100 flex justify-end gap-3">
                    <a href="/post/{{ post.id }}"
                       class="px-6 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl transition">
                        취소
                    </a>
                    <button type="submit"
                            class="px-8 py-3 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl shadow-md transition transform hover:-translate-y-0.5">
                        수정 완료
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

{% endblock %}
