{% extends "layout.html" %}
{% block content %}

<script src="https://cdn.tailwindcss.com"></script>

<style>
    .page-main, .page-container {
        padding: 0 !important;
        margin: 0 !important;
        background: transparent !important;
        max-width: none !important;
    }
</style>

<div class="min-h-screen bg-[#F3F4F6] py-12">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">

        <div class="mb-6 flex justify-between items-center">
            <a href="/post" class="inline-flex items-center gap-2 text-gray-500 hover:text-purple-700 transition font-medium">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M15 19l-7-7 7-7"></path>
                </svg>
                목록으로 돌아가기
            </a>

            <div class="w-20 sm:hidden"></div> </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 sm:p-10">

            <form id="newPostForm" action="/post" method="post" class="space-y-8">
                <input type="hidden" id="postTypeInput" name="type" value="normal" />

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-3">어떤 이야기를 하고 싶으신가요?</label>
                    <div class="flex p-1 bg-gray-100 rounded-xl gap-1">
                        <button type="button" data-type="normal"
                                class="post-type-btn flex-1 py-3 rounded-lg text-sm font-bold transition-all shadow-sm bg-white text-purple-700 ring-1 ring-black/5">
                            일반 글
                        </button>
                        <button type="button" data-type="balance"
                                class="post-type-btn flex-1 py-3 rounded-lg text-sm font-bold transition-all text-gray-500 hover:text-gray-700 hover:bg-gray-50">
                            밸런스 투표
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">제목</label>
                    <input type="text" name="title" required maxlength="100"
                           class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:bg-white focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition"
                           placeholder="제목을 입력해주세요" />
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">내용</label>
                    <textarea name="content" rows="10" required maxlength="1000"
                              class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:bg-white focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition resize-none leading-relaxed"
                              placeholder="내용을 입력해주세요."></textarea>
                </div>

                <div id="balanceSection" style="display: none;" class="bg-purple-50 rounded-xl p-6 border border-purple-100">
                    <div class="flex items-center justify-between mb-4">
                        <label class="block text-sm font-bold text-purple-900">투표 선택지 설정</label>
                        <span class="text-xs text-purple-600 font-medium bg-white px-2 py-1 rounded-lg shadow-sm">최대 4개</span>
                    </div>

                    <div id="optionsBox" class="space-y-3">
                    </div>

                    <button type="button" id="addOptionBtn"
                            class="mt-4 w-full py-3 border-2 border-dashed border-purple-300 rounded-xl text-purple-600 font-bold hover:bg-purple-100 hover:border-purple-400 transition flex items-center justify-center gap-2">
                        <span>➕ 선택지 추가하기</span>
                    </button>
                </div>

                <div class="pt-6 border-t border-gray-100 flex justify-end">
                    <button type="submit"
                            class="px-8 py-3 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl shadow-md transition transform hover:-translate-y-0.5">
                        작성 완료
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

<script>
    const typeBtns = document.querySelectorAll('.post-type-btn');
    const postTypeInput = document.getElementById('postTypeInput');
    const balanceSection = document.getElementById('balanceSection');
    const optionsBox = document.getElementById('optionsBox');
    const addOptionBtn = document.getElementById('addOptionBtn');

    let optionCount = 2;
    const MAX = 4;

    function renderOptions() {
        const currentInputs = optionsBox.querySelectorAll('input[name="options"]');
        const savedValues = Array.from(currentInputs).map(input => input.value);

        optionsBox.innerHTML = '';

        for (let i = 0; i < optionCount; i++) {
            const row = document.createElement('div');
            row.className = 'flex gap-2 items-center group';

            const val = savedValues[i] || '';

            row.innerHTML = `
                <div class="flex-1 relative">
                    <span class="absolute left-4 top-3.5 text-gray-400 text-sm font-bold">#${i + 1}</span>
                    <input type="text" name="options" value="${val}" required
                        placeholder="선택지 내용을 입력하세요"
                        class="w-full pl-12 pr-4 py-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 outline-none transition">
                </div>
                ${i >= 2 ? `
                    <button type="button"
                        class="p-3 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-xl transition"
                        title="삭제"
                        onclick="removeOption(${i})">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                ` : ''}
            `;

            optionsBox.appendChild(row);
        }

        addOptionBtn.style.display = optionCount >= MAX ? 'none' : 'block';

        toggleOptionsStatus(postTypeInput.value === 'balance');
    }

    function removeOption(i) {
        if (optionCount <= 2) return;
        optionCount--;
        renderOptions();
    }

    addOptionBtn.onclick = () => {
        if (optionCount >= MAX) return;
        optionCount++;
        renderOptions();
    };

    function toggleOptionsStatus(isBalanceMode) {
        const inputs = optionsBox.querySelectorAll('input[name="options"]');
        inputs.forEach(input => {
            if (isBalanceMode) {
                input.disabled = false;
            } else {
                input.disabled = true;
            }
        });
    }

    // 초기 렌더링
    renderOptions();

    typeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            // 스타일 리셋
            typeBtns.forEach(b => {
                b.className = 'post-type-btn flex-1 py-3 rounded-lg text-sm font-bold transition-all text-gray-500 hover:text-gray-700 hover:bg-gray-50';
            });

            // 선택된 버튼 스타일 적용
            btn.className = 'post-type-btn flex-1 py-3 rounded-lg text-sm font-bold transition-all shadow-sm bg-white text-purple-700 ring-1 ring-black/5';

            // 값 변경
            const type = btn.dataset.type;
            postTypeInput.value = type;

            // UI 표시 여부
            const isBalance = (type === 'balance');
            balanceSection.style.display = isBalance ? 'block' : 'none';

            toggleOptionsStatus(isBalance);
        });
    });
</script>

{% endblock %}
