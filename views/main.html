{% extends "layout.html" %}
{% block content %}

<script src="https://cdn.tailwindcss.com"></script>

<style>
    /* 레이아웃 헤더 등 숨김 */
    header, footer { display: none !important; }
    .page-main, .page-container {
        padding: 0 !important; margin: 0 !important;
        background: transparent !important; max-width: none !important;
    }
    body { overflow: hidden; }

    /* 배경 애니메이션 (홈 화면과 동일) */
    @keyframes float {
        0% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(30px, -50px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.9); }
        100% { transform: translate(0px, 0px) scale(1); }
    }
    .blob { animation: float 7s infinite; }
</style>

<div class="min-h-screen bg-[#F3F4F6] relative flex items-center justify-center overflow-hidden">

    <div class="absolute top-0 left-1/4 w-96 h-96 bg-purple-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 blob"></div>
    <div class="absolute top-0 right-1/4 w-96 h-96 bg-blue-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 blob" style="animation-delay: 2s"></div>
    <div class="absolute -bottom-32 left-1/3 w-96 h-96 bg-indigo-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 blob" style="animation-delay: 4s"></div>

    <div class="relative w-full max-w-md bg-white/80 backdrop-blur-xl rounded-3xl shadow-2xl p-8 sm:p-10 border border-white z-10 m-4">

        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-purple-600 to-blue-500 rounded-2xl shadow-lg mb-6 transform rotate-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                </svg>
            </div>
            <h2 class="text-2xl font-extrabold text-gray-900 mb-2">Welcome Back!</h2>
            <p class="text-gray-500 text-sm">취업 준비의 시작, 취업 밸런스</p>
        </div>

        <form action="/auth/login" method="post" class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2 ml-1">이메일</label>
                <input type="email" name="email" required placeholder="example@email.com"
                       class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-purple-500 outline-none transition text-gray-900 placeholder-gray-400" />
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2 ml-1">비밀번호</label>
                <input type="password" name="password" required placeholder="••••••••"
                       class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-purple-500 outline-none transition text-gray-900 placeholder-gray-400" />
            </div>

            {% if loginError %}
            <div class="flex items-center gap-2 bg-red-50 text-red-600 px-4 py-3 rounded-xl text-sm font-medium animate-pulse border border-red-100">
                <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                {{ loginError }}
            </div>
            {% endif %}

            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-purple-600 to-blue-600 text-white font-bold rounded-xl shadow-lg hover:shadow-xl hover:opacity-90 transition-all transform hover:-translate-y-0.5">
                로그인하기
            </button>
        </form>

        <div class="mt-8 text-center">
            <p class="text-sm text-gray-500">
                아직 계정이 없으신가요?
                <a href="/join" class="text-purple-600 font-bold hover:text-purple-700 hover:underline ml-1">회원가입</a>
            </p>
        </div>
    </div>
</div>

{% endblock %}
