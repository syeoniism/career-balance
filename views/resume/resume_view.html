{% extends "layout.html" %}

{% block content %}

<script src="https://cdn.tailwindcss.com"></script>

<style>
    .page-main, .page-container {
        padding: 0 !important;
        margin: 0 !important;
        background: transparent !important;
        max-width: none !important;
    }
</style>

<div class="min-h-screen bg-[#F3F4F6] py-12">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8" id="resumeContainer">
        <div class="flex flex-col items-center justify-center py-20">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-purple-600 mb-4"></div>
            <p class="text-gray-500">이력서를 불러오는 중입니다...</p>
        </div>
    </div>
</div>

<script>
    const resumeId = "{{ resumeId }}";

    if (!resumeId) {
        document.getElementById("resumeContainer").innerHTML =
            `<div class='text-center py-20 text-gray-500'>잘못된 접근입니다.</div>`;
    } else {
        loadResume(resumeId);
    }

    function getSectionContent(sections, type) {
        const found = sections.find(s => s.section_type === type);
        return found ? (found.content || "") : "";
    }

    function renderResume(container, data) {
        const resume = data.resume;
        const sections = data.sections || [];

        const summary     = getSectionContent(sections, "summary");
        const education   = getSectionContent(sections, "education");
        const internships = getSectionContent(sections, "internships");
        const projects    = getSectionContent(sections, "projects");
        const awards      = getSectionContent(sections, "awards");
        const activities  = getSectionContent(sections, "activities");
        const skills      = getSectionContent(sections, "skills");
        const others      = getSectionContent(sections, "others");

        const githubLink = resume.github_id ? `https://github.com/${resume.github_id}` : null;
        const profileImg = resume.profile_image_url || "/default-profile.png";

        const icons = {
            email: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>',
            phone: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>',
            github: '<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd" /></svg>'
        };

        const createSectionHtml = (title, content) => {
            if (!content) return "";
            return `
                <div class="py-8 border-t border-gray-100 first:border-0 first:pt-0">
                    <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">
                        <span class="w-1.5 h-1.5 bg-purple-500 rounded-full"></span>
                        ${title}
                    </h2>
                    <div class="text-gray-700 leading-relaxed whitespace-pre-wrap pl-3.5 border-l-2 border-gray-100 ml-0.5">${content}</div>
                </div>
            `;
        };

        container.innerHTML = `
            <div class="mb-6 flex justify-between items-center">
                <a href="/user/mypage" class="inline-flex items-center gap-2 text-gray-500 hover:text-purple-700 transition font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M15 19l-7-7 7-7"></path>
                    </svg>
                    목록으로
                </a>

                <div class="flex gap-2">
                    <button onclick="downloadPDF(${resume.id})" class="px-4 py-2 bg-white border border-gray-200 text-gray-700 font-bold rounded-lg hover:bg-gray-50 hover:text-purple-600 transition shadow-sm text-sm">
                        PDF 저장
                    </button>
                    <a href="/resume/${resume.id}/edit" class="px-4 py-2 bg-white border border-gray-200 text-gray-700 font-bold rounded-lg hover:bg-gray-50 hover:text-purple-600 transition shadow-sm text-sm">
                        수정하기
                    </a>
                    <button onclick="deleteResume(${resume.id})" class="px-4 py-2 bg-white border border-gray-200 text-red-500 font-bold rounded-lg hover:bg-red-50 hover:border-red-100 transition shadow-sm text-sm">
                        삭제
                    </button>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="p-8 sm:p-10 bg-white">
                    <div class="flex flex-col md:flex-row gap-8 items-start">
                        <div class="flex-shrink-0">
                            <img src="${profileImg}" alt="프로필 이미지"
                                class="w-32 h-32 rounded-2xl object-cover border border-gray-100 shadow-sm bg-gray-50">
                        </div>

                        <div class="flex-1 w-full">
                            <h1 class="text-3xl font-bold text-gray-900 mb-2">${resume.name || "이름 없음"}</h1>
                            <p class="text-lg text-purple-600 font-medium mb-4">${resume.resume_title || "제목 없음"}</p>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-y-2 gap-x-6 text-sm text-gray-600 bg-gray-50 p-4 rounded-xl border border-gray-100">
                                ${resume.email ? `<div class="flex items-center gap-2">${icons.email} <span>${resume.email}</span></div>` : ""}
                                ${resume.telephone ? `<div class="flex items-center gap-2">${icons.phone} <span>${resume.telephone}</span></div>` : ""}
                                ${githubLink ? `<div class="flex items-center gap-2 col-span-1 sm:col-span-2">${icons.github} <a href="${githubLink}" target="_blank" class="text-gray-700 hover:text-purple-600 underline decoration-gray-300 hover:decoration-purple-500 underline-offset-2 transition">${resume.github_id}</a></div>` : ""}
                            </div>
                        </div>
                    </div>

                    ${summary ? `
                        <div class="mt-8">
                            <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-2">Summary</h2>
                            <p class="text-gray-700 leading-relaxed whitespace-pre-wrap text-lg font-medium">${summary}</p>
                        </div>
                    ` : ""}
                </div>

                <div class="h-2 bg-gray-50 border-t border-b border-gray-100"></div>

                <div class="p-8 sm:p-10 space-y-2">
                    ${createSectionHtml("학력 Education", education)}
                    ${createSectionHtml("인턴십 Internships", internships)}
                    ${createSectionHtml("프로젝트 Projects", projects)}
                    ${createSectionHtml("기술 및 어학 Skills", skills)}
                    ${createSectionHtml("수상 경력 Awards", awards)}
                    ${createSectionHtml("대외 활동 Activities", activities)}
                    ${createSectionHtml("기타 Others", others)}

                    ${!education && !internships && !projects && !skills && !awards && !activities && !others
            ? `<div class="text-center py-10 text-gray-400">작성된 상세 내용이 없습니다.</div>` : ""}
                </div>
            </div>
        `;
    }

    function downloadPDF(id) {
        window.open(`/resume/${id}/pdf`, "_blank");
    }

    async function deleteResume(id) {
        if (!confirm("정말 이력서를 삭제하시겠습니까?\n삭제된 데이터는 복구할 수 없습니다.")) return;

        try {
            const res = await fetch(`/api/resumes/${id}`, { method: "DELETE" });

            if (res.ok) {
                alert("삭제되었습니다.");
                location.href = "/user/mypage";
            } else {
                const data = await res.json();
                alert("삭제 실패: " + (data.message || "알 수 없는 오류"));
            }
        } catch (err) {
            console.error(err);
            alert("서버 통신 오류가 발생했습니다.");
        }
    }

    async function loadResume(id) {
        const container = document.getElementById("resumeContainer");

        try {
            const res = await fetch(`/api/resumes/${id}`);
            const data = await res.json();

            if (!res.ok) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-sm p-10 text-center">
                        <p class="text-gray-500 mb-4">${data.message || "이력서를 찾을 수 없습니다."}</p>
                        <a href="/user/mypage" class="text-purple-600 font-bold hover:underline">목록으로 돌아가기</a>
                    </div>`;
                return;
            }

            renderResume(container, data);
        } catch (err) {
            console.error(err);
            container.innerHTML = `<div class='text-center py-20 text-red-500'>데이터를 불러오는 중 오류가 발생했습니다.</div>`;
        }
    }
</script>

{% endblock %}
