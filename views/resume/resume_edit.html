{% extends "layout.html" %}

{% block content %}

<script src="https://cdn.tailwindcss.com"></script>

<style>
    .page-main, .page-container {
        padding: 0 !important;
        margin: 0 !important;
        background: transparent !important;
        max-width: none !important;
    }
</style>

<div class="min-h-screen bg-[#F3F4F6] py-12">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center mb-10">
            <h1 class="text-2xl font-bold text-gray-900 mb-2">이력서 수정하기</h1>
        </div>
        <div class="mb-6 flex justify-between items-center">
            <button onclick="history.back()" class="inline-flex items-center gap-2 text-gray-500 hover:text-purple-700 transition font-medium">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M15 19l-7-7 7-7"></path>
                </svg>
                뒤로 가기
            </button>

            <button type="button" onclick="saveEdit()"
                    class="sm:hidden flex items-center gap-1 px-4 py-2 bg-purple-600 text-white text-sm font-bold rounded-lg shadow-sm">
                수정 완료
            </button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 sm:p-10">

            <form id="editForm" enctype="multipart/form-data" onsubmit="return false;" class="space-y-8">

                <div class="flex flex-col md:flex-row gap-8">
                    <div class="flex-shrink-0 flex flex-col items-center">
                        <label class="block text-sm font-bold text-gray-700 mb-2">프로필 사진</label>
                        <div class="relative group cursor-pointer w-32 h-40 bg-gray-100 rounded-xl overflow-hidden border-2 border-dashed border-gray-300 hover:border-purple-400 transition flex items-center justify-center">
                            <img id="preview" src="/default-profile.png" class="absolute inset-0 w-full h-full object-cover" />

                            <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                                <span class="text-white text-xs font-bold">사진 변경</span>
                            </div>

                            <input type="file" id="profile_image" name="profile_image" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" />
                        </div>
                    </div>

                    <div class="flex-1 space-y-4">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">이력서 제목 <span class="text-red-500">*</span></label>
                            <input id="resume_title" name="resume_title" required
                                   class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-purple-500 outline-none transition" />
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">이름 <span class="text-red-500">*</span></label>
                                <input id="name" name="name" required
                                       class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-purple-500 outline-none transition" />
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">전화번호</label>
                                <input id="telephone" name="telephone"
                                       class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-purple-500 outline-none transition" />
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">이메일</label>
                                <input id="email" name="email" type="email"
                                       class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-purple-500 outline-none transition" />
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">GitHub ID</label>
                                <div class="relative">
                                    <span class="absolute left-4 top-3.5 text-gray-400 text-sm">github.com/</span>
                                    <input id="github_id" name="github_id"
                                           class="w-full pl-24 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-purple-500 outline-none transition" />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <hr class="border-gray-100" />

                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-bold text-gray-900 mb-2 flex items-center gap-2">
                            <span class="w-1 h-4 bg-purple-500 rounded-full"></span> 요약 (Summary)
                        </label>
                        <textarea id="summary" name="summary" rows="3"
                                  class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-purple-500 outline-none transition resize-none"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-900 mb-2 flex items-center gap-2">
                            <span class="w-1 h-4 bg-purple-500 rounded-full"></span> 학력 (Education)
                        </label>
                        <textarea id="education" name="education" rows="3"
                                  class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-purple-500 outline-none transition resize-none"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-900 mb-2 flex items-center gap-2">
                            <span class="w-1 h-4 bg-purple-500 rounded-full"></span> 인턴십 & 경력 (Internships)
                        </label>
                        <textarea id="internships" name="internships" rows="4"
                                  class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-purple-500 outline-none transition resize-none"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-900 mb-2 flex items-center gap-2">
                            <span class="w-1 h-4 bg-purple-500 rounded-full"></span> 프로젝트 경험 (Projects)
                        </label>
                        <textarea id="projects" name="projects" rows="4"
                                  class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-purple-500 outline-none transition resize-none"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-900 mb-2 flex items-center gap-2">
                            <span class="w-1 h-4 bg-purple-500 rounded-full"></span> 수상 경력 (Awards)
                        </label>
                        <textarea id="awards" name="awards" rows="3"
                                  class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-purple-500 outline-none transition resize-none"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-900 mb-2 flex items-center gap-2">
                            <span class="w-1 h-4 bg-purple-500 rounded-full"></span> 외부 활동 (Activities)
                        </label>
                        <textarea id="activities" name="activities" rows="3"
                                  class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-purple-500 outline-none transition resize-none"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-900 mb-2 flex items-center gap-2">
                            <span class="w-1 h-4 bg-purple-500 rounded-full"></span> 영어 성적 / 스킬 (Skills)
                        </label>
                        <textarea id="skills" name="skills" rows="3"
                                  class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-purple-500 outline-none transition resize-none"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-900 mb-2">기타 (Others)</label>
                        <textarea id="others" name="others" rows="2"
                                  class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-purple-500 outline-none transition resize-none"></textarea>
                    </div>
                </div>

                <div class="pt-6 border-t border-gray-100 flex flex-col sm:flex-row items-center justify-between gap-4">
                    <label for="is_public" class="flex items-center gap-3 cursor-pointer group select-none">
                        <div class="relative">
                            <input type="checkbox" id="is_public" class="peer sr-only" />
                            <div class="w-10 h-6 bg-gray-200 rounded-full peer peer-checked:bg-purple-600 transition"></div>
                            <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition transform peer-checked:translate-x-4"></div>
                        </div>
                        <span class="text-sm font-bold text-gray-600 group-hover:text-purple-600 transition">이력서 공개하기</span>
                    </label>

                    <div class="flex gap-3 w-full sm:w-auto">
                        <button type="button" onclick="history.back()" class="flex-1 sm:flex-none px-6 py-3 border border-gray-300 text-gray-600 font-bold rounded-xl hover:bg-gray-50 transition">
                            취소
                        </button>
                        <button type="button" onclick="saveEdit()" class="flex-1 sm:flex-none px-8 py-3 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl shadow-md transition transform hover:-translate-y-0.5">
                            수정 완료
                        </button>
                    </div>
                </div>

            </form>
        </div>
    </div>
</div>

<script>
    let resumeId = "{{ resumeId }}";

    /* 프로필 미리보기 */
    document.getElementById("profile_image").addEventListener("change", function () {
        if (this.files.length > 0) {
            document.getElementById("preview").src = URL.createObjectURL(this.files[0]);
        }
    });

    function getSection(sections, type) {
        const s = sections.find(v => v.section_type === type);
        return s ? s.content : "";
    }

    /* 이력서 로드 */
    async function loadResume() {
        if(!resumeId) return;

        const res = await fetch(`/api/resumes/${resumeId}`);
        const data = await res.json();

        const resume = data.resume;
        const sections = data.sections;

        document.getElementById("resume_title").value = resume.resume_title;
        document.getElementById("name").value = resume.name;
        document.getElementById("email").value = resume.email || "";
        document.getElementById("telephone").value = resume.telephone || "";
        document.getElementById("github_id").value = resume.github_id || "";

        document.getElementById("is_public").checked = resume.is_public === 1;

        // 미리보기 이미지 업데이트
        document.getElementById("preview").src = resume.profile_image_url || "/default-profile.png";

        document.getElementById("summary").value     = getSection(sections, "summary");
        document.getElementById("education").value   = getSection(sections, "education");
        document.getElementById("internships").value = getSection(sections, "internships");
        document.getElementById("projects").value    = getSection(sections, "projects");
        document.getElementById("awards").value      = getSection(sections, "awards");
        document.getElementById("activities").value  = getSection(sections, "activities");
        document.getElementById("skills").value      = getSection(sections, "skills");
        document.getElementById("others").value      = getSection(sections, "others");
    }

    /* 저장 */
    async function saveEdit() {
        const form = new FormData(document.getElementById("editForm"));
        form.set("is_public", document.getElementById("is_public").checked ? "1" : "0");

        const res = await fetch(`/api/resumes/${resumeId}`, {
            method: "PUT",
            body: form
        });

        const json = await res.json();

        if (res.ok) {
            alert("이력서가 성공적으로 수정되었습니다!");
            location.href = `/resume/${resumeId}`;
        } else {
            alert("수정 실패: " + json.message);
        }
    }

    window.onload = function () {
        loadResume();
    };
</script>

{% endblock %}
