{% extends "layout.html" %}
{% block content %}

<script src="https://cdn.tailwindcss.com"></script>

<style>
    .page-main, .page-container {
        padding: 0 !important;
        margin: 0 !important;
        background: transparent !important;
        max-width: none !important;
    }
</style>

<div class="min-h-screen bg-[#F3F4F6] py-12">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center mb-10">
            <h1 class="text-2xl font-bold text-gray-900 mb-2">자기소개서 수정하기</h1>
        </div>

        <div class="mb-6 flex justify-between items-center">
            <button onclick="history.back()" class="inline-flex items-center gap-2 text-gray-500 hover:text-purple-700 transition font-medium">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M15 19l-7-7 7-7"></path>
                </svg>
                뒤로 가기
            </button>

            <button type="button" onclick="document.getElementById('editForm').dispatchEvent(new Event('submit', {cancelable: true, bubbles: true}))"
                    class="sm:hidden flex items-center gap-1 px-4 py-2 bg-purple-600 text-white text-sm font-bold rounded-lg shadow-sm">
                수정 완료
            </button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 sm:p-10">

            <form id="editForm" class="space-y-8">

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">자기소개서 제목 <span class="text-red-500">*</span></label>
                    <input type="text" id="title" name="title" required
                           class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-purple-500 outline-none transition text-lg font-medium placeholder-gray-400" />
                </div>

                <hr class="border-gray-100" />

                <div class="space-y-8">

                    <div>
                        <label class="block text-sm font-bold text-gray-900 mb-3 flex items-center gap-2">
                            <span class="w-1 h-4 bg-purple-500 rounded-full"></span> 성장배경
                        </label>
                        <textarea id="background" name="background" rows="6"
                                  class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-purple-500 outline-none transition resize-none leading-relaxed"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-900 mb-3 flex items-center gap-2">
                            <span class="w-1 h-4 bg-purple-500 rounded-full"></span> 성격의 장단점
                        </label>
                        <textarea id="strengths" name="strengths" rows="6"
                                  class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-purple-500 outline-none transition resize-none leading-relaxed"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-900 mb-3 flex items-center gap-2">
                            <span class="w-1 h-4 bg-purple-500 rounded-full"></span> 지원동기
                        </label>
                        <textarea id="motivation" name="motivation" rows="6"
                                  class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-purple-500 outline-none transition resize-none leading-relaxed"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-900 mb-3 flex items-center gap-2">
                            <span class="w-1 h-4 bg-purple-500 rounded-full"></span> 입사 후 포부
                        </label>
                        <textarea id="future" name="future" rows="6"
                                  class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-purple-500 outline-none transition resize-none leading-relaxed"></textarea>
                    </div>

                </div>

                <div class="pt-8 border-t border-gray-100 flex flex-col sm:flex-row items-center justify-between gap-6">

                    <label class="flex items-center gap-3 cursor-pointer group select-none">
                        <div class="relative">
                            <input type="checkbox" id="is_public" class="peer sr-only" />
                            <div class="w-11 h-6 bg-gray-200 rounded-full peer peer-checked:bg-purple-600 transition-colors"></div>
                            <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-5"></div>
                        </div>
                        <span class="text-sm font-bold text-gray-600 group-hover:text-purple-600 transition">공개 자기소개서로 설정</span>
                    </label>

                    <div class="flex gap-3 w-full sm:w-auto">
                        <button type="button" onclick="history.back()" class="flex-1 sm:flex-none px-6 py-3 border border-gray-300 text-gray-600 font-bold rounded-xl hover:bg-gray-50 transition">
                            취소
                        </button>
                        <button type="submit" class="flex-1 sm:flex-none px-8 py-3 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl shadow-md transition transform hover:-translate-y-0.5 flex items-center justify-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                            </svg>
                            <span>수정 완료</span>
                        </button>
                    </div>
                </div>

            </form>
        </div>
    </div>
</div>

<script>
    // URL에서 ID 추출
    const id = location.pathname.split("/").pop();

    // 데이터 불러오기
    async function loadData() {
        try {
            const res = await fetch(`/api/coverletters/${id}`);
            const data = await res.json();

            document.getElementById("title").value = data.coverLetter.title;
            document.getElementById("is_public").checked = data.coverLetter.is_public === 1;

            const sections = data.sections.reduce((acc, s) => {
                acc[s.section_type] = s.content;
                return acc;
            }, {});

            document.getElementById("background").value  = sections.background || "";
            document.getElementById("strengths").value   = sections.strengths || "";
            document.getElementById("motivation").value  = sections.motivation || "";
            document.getElementById("future").value      = sections.future || "";
        } catch (err) {
            console.error(err);
            alert("데이터를 불러오는 중 오류가 발생했습니다.");
        }
    }

    loadData();

    // 수정 데이터 전송
    document.getElementById("editForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const body = {
            title: document.getElementById("title").value,
            background: document.getElementById("background").value,
            strengths: document.getElementById("strengths").value,
            motivation: document.getElementById("motivation").value,
            future: document.getElementById("future").value,
            is_public: document.getElementById("is_public").checked ? 1 : 0
        };

        try {
            const res = await fetch(`/api/coverletters/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });

            if (res.ok) {
                alert("수정되었습니다!");
                location.href = `/coverletter/view/${id}`;
            } else {
                const json = await res.json();
                alert("수정 실패: " + (json.message || "오류가 발생했습니다."));
            }
        } catch (err) {
            console.error(err);
            alert("서버 통신 중 오류가 발생했습니다.");
        }
    });
</script>

{% endblock %}
