{% extends "layout.html" %}

{% block content %}

<script src="https://cdn.tailwindcss.com"></script>

<style>
    .page-main, .page-container {
        padding: 0 !important;
        margin: 0 !important;
        background: transparent !important;
        max-width: none !important;
    }
</style>

<div class="min-h-screen bg-[#F3F4F6] py-12">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center mb-10">
            <h1 class="text-2xl font-bold text-gray-900 mb-2">자기소개서 작성하기</h1>
        </div>
        <div class="mb-6 flex justify-between items-center">
            <button onclick="history.back()" class="inline-flex items-center gap-2 text-gray-500 hover:text-purple-700 transition font-medium">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M15 19l-7-7 7-7"></path>
                </svg>
                뒤로 가기
            </button>

            <div class="flex items-center gap-3">
                <a href="/coverletter/auto-draft"
                   class="flex items-center gap-1.5 px-4 py-2 bg-orange-100 text-orange-600 font-bold rounded-xl hover:bg-orange-200 transition text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                    <span>AI 자동작성</span>
                </a>

                <button type="button" onclick="document.getElementById('newForm').dispatchEvent(new Event('submit', {cancelable: true, bubbles: true}))"
                        class="sm:hidden flex items-center gap-1 px-4 py-2 bg-purple-600 text-white text-sm font-bold rounded-lg shadow-sm">
                    저장
                </button>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 sm:p-10">

            <form id="newForm" class="space-y-8">

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">자기소개서 제목 <span class="text-red-500">*</span></label>
                    <input type="text" id="title" name="title" required placeholder="예: 백엔드 개발자 지원_홍길동"
                           class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-purple-500 outline-none transition text-lg font-medium placeholder-gray-400" />
                </div>

                <hr class="border-gray-100" />

                <div class="space-y-8">

                    <div>
                        <label class="block text-sm font-bold text-gray-900 mb-3 flex items-center gap-2">
                            <span class="w-1 h-4 bg-purple-500 rounded-full"></span> 성장배경
                        </label>
                        <textarea id="background" name="background" rows="6" placeholder="어떤 환경에서 성장하며 어떤 가치관을 갖게 되었는지 작성해주세요."
                                  class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-purple-500 outline-none transition resize-none leading-relaxed"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-900 mb-3 flex items-center gap-2">
                            <span class="w-1 h-4 bg-purple-500 rounded-full"></span> 성격의 장단점
                        </label>
                        <textarea id="strengths" name="strengths" rows="6" placeholder="본인의 강점과 보완하고 싶은 점, 이를 극복하기 위한 노력을 작성해주세요."
                                  class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-purple-500 outline-none transition resize-none leading-relaxed"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-900 mb-3 flex items-center gap-2">
                            <span class="w-1 h-4 bg-purple-500 rounded-full"></span> 지원동기
                        </label>
                        <textarea id="motivation" name="motivation" rows="6" placeholder="해당 직무와 기업에 지원하게 된 계기를 구체적으로 작성해주세요."
                                  class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-purple-500 outline-none transition resize-none leading-relaxed"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-900 mb-3 flex items-center gap-2">
                            <span class="w-1 h-4 bg-purple-500 rounded-full"></span> 입사 후 포부
                        </label>
                        <textarea id="future" name="future" rows="6" placeholder="입사 후 어떤 목표를 가지고 성장하고 싶은지 작성해주세요."
                                  class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-purple-500 outline-none transition resize-none leading-relaxed"></textarea>
                    </div>

                </div>

                <div class="pt-8 border-t border-gray-100 flex flex-col sm:flex-row items-center justify-between gap-6">

                    <label class="flex items-center gap-3 cursor-pointer group select-none">
                        <div class="relative">
                            <input type="checkbox" id="is_public" class="peer sr-only" />
                            <div class="w-11 h-6 bg-gray-200 rounded-full peer peer-checked:bg-purple-600 transition-colors"></div>
                            <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-5"></div>
                        </div>
                        <span class="text-sm font-bold text-gray-600 group-hover:text-purple-600 transition">공개 자기소개서로 설정</span>
                    </label>

                    <div class="flex gap-3 w-full sm:w-auto">
                        <button type="button" onclick="history.back()" class="flex-1 sm:flex-none px-6 py-3 border border-gray-300 text-gray-600 font-bold rounded-xl hover:bg-gray-50 transition">
                            취소
                        </button>
                        <button type="submit" class="flex-1 sm:flex-none px-8 py-3 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl shadow-md transition transform hover:-translate-y-0.5 flex items-center justify-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
                            </svg>
                            <span>저장하기</span>
                        </button>
                    </div>
                </div>

            </form>
        </div>
    </div>
</div>

<script>
    document.getElementById("newForm").addEventListener("submit", async (e) => {
        if(e) e.preventDefault();

        const formEl = document.getElementById("newForm");
        // HTML5 Validation check
        if (!formEl.checkValidity()) {
            formEl.reportValidity();
            return;
        }

        const body = {
            title: document.getElementById("title").value,
            background: document.getElementById("background").value,
            strengths: document.getElementById("strengths").value,
            motivation: document.getElementById("motivation").value,
            future: document.getElementById("future").value,
            is_public: document.getElementById("is_public").checked ? 1 : 0
        };

        try {
            const res = await fetch("/api/coverletters", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });

            const json = await res.json();

            if (res.ok) {
                alert("자기소개서가 성공적으로 저장되었습니다!");
                location.href="/user/mypage";
            } else {
                alert(json.message || "생성 실패");
            }
        } catch (err) {
            console.error(err);
            alert("서버 통신 중 오류가 발생했습니다.");
        }
    });

    window.onload = function () {
        const params = new URLSearchParams(window.location.search);

        // 자동 생성 페이지에서 왔을 경우 (Localstorage 키값 유지)
        if (params.get("from") === "auto") {
            document.getElementById("title").value =
                localStorage.getItem("cl_auto_title") || "";

            document.getElementById("background").value =
                localStorage.getItem("cl_auto_background") || "";

            document.getElementById("strengths").value =
                localStorage.getItem("cl_auto_strengths") || "";

            document.getElementById("motivation").value =
                localStorage.getItem("cl_auto_motivation") || "";

            document.getElementById("future").value =
                localStorage.getItem("cl_auto_future") || "";
        }
    };
</script>

{% endblock %}
