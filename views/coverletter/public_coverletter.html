{% extends "layout.html" %}
{% block content %}

<script src="https://cdn.tailwindcss.com"></script>

<style>
    /* 공유 페이지 전용 스타일 */
    header, footer { display: none !important; }
    .page-main, .page-container {
        padding: 0 !important; margin: 0 !important;
        background: transparent !important; max-width: none !important;
    }
    body { background-color: #F3F4F6; }
</style>

<div class="min-h-screen py-12 px-4 sm:px-6 lg:px-8 flex justify-center">
    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-lg border border-gray-200 overflow-hidden" id="clContainer">
        <div class="flex flex-col items-center justify-center py-20">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-purple-600 mb-4"></div>
            <p class="text-gray-500">자기소개서를 불러오는 중입니다...</p>
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(location.search);
    const token = params.get("token");

    if (!token) {
        document.getElementById("clContainer").innerHTML =
            `<div class='p-20 text-center text-gray-500'>잘못된 접근입니다. (토큰 누락)</div>`;
    } else {
        loadPublicCL(token);
    }

    function getSectionContent(sections, type) {
        const found = sections.find(s => s.section_type === type);
        return found ? (found.content || "") : "";
    }

    function renderCoverLetter(container, data) {
        const cl = data.coverLetter;
        const sections = data.sections || [];

        const background = getSectionContent(sections, "background");
        const strengths  = getSectionContent(sections, "strengths");
        const motivation = getSectionContent(sections, "motivation");
        const future     = getSectionContent(sections, "future");

        const createSectionHtml = (title, content) => {
            return `
                <div class="py-8 border-t border-gray-100 first:border-0 first:pt-0">
                    <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">
                        <span class="w-1.5 h-1.5 bg-purple-500 rounded-full"></span>
                        ${title}
                    </h2>
                    <div class="text-gray-700 leading-relaxed whitespace-pre-wrap break-words pl-3.5 border-l-2 border-gray-100 ml-0.5 min-h-[60px]">${content || "<span class='text-gray-400'>작성된 내용이 없습니다.</span>"}</div>
                </div>
            `;
        };

        container.innerHTML = `
            <div class="p-10 border-b border-gray-50 bg-white">
                <span class="inline-block px-3 py-1 bg-purple-50 text-purple-600 text-xs font-bold rounded-full mb-3">자기소개서</span>
                <h1 class="text-3xl font-bold text-gray-900 leading-tight">${cl.title}</h1>
                <p class="text-gray-400 text-sm mt-2">작성일: ${cl.created_at ? new Date(cl.created_at).toLocaleDateString() : '-'}</p>
            </div>

            <div class="p-10 bg-white space-y-2">
                ${createSectionHtml("성장배경", background)}
                ${createSectionHtml("성격의 장단점", strengths)}
                ${createSectionHtml("지원동기", motivation)}
                ${createSectionHtml("입사 후 포부", future)}
            </div>

            <div class="bg-gray-50 py-4 text-center border-t border-gray-100">
                <p class="text-xs text-gray-400 font-medium">Powered by <span class="text-purple-600 font-bold">취업 밸런스</span></p>
            </div>
        `;
    }

    async function loadPublicCL(token) {
        const container = document.getElementById("clContainer");
        try {
            const res = await fetch(`/api/coverletters/public/${token}`);
            const data = await res.json();

            if (!res.ok) {
                container.innerHTML = `<div class='p-20 text-center text-gray-500'>${data.message || "존재하지 않는 자기소개서입니다."}</div>`;
                return;
            }

            renderCoverLetter(container, data);
        } catch (err) {
            console.error(err);
            container.innerHTML = `<div class='p-20 text-center text-red-500'>네트워크 오류가 발생했습니다.</div>`;
        }
    }
</script>

{% endblock %}
